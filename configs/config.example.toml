# 主运行配置；含凭证，请保持 0600 权限，不提交 Git。
# 业务多维表格拓扑与字段映射独立存放于 configs/tables/。
tables_file = "configs/tables/enterprise.example.json"

# 识别提供方：anyreceipt = 外部服务；model = 自有 Anthropic 模块；disabled = 关闭。
# trigger_mode：event / poll / both；poll_startup：baseline / process。
[recognition]
provider = "disabled"
trigger_mode = "both"
poll_interval = "5m"
poll_startup = "baseline"

# 审核提供方：seal = 外部 SealAI；model = 自有 Anthropic 模块。
# trigger_mode：after_recognition = 识别完成自动送审；manual = 手动提交。
# 仅 model 需要 rules_file = "rules/review.example.json"，相对主配置目录解析。
[review]
provider = "seal"
trigger_mode = "manual"
include_transactions = true
resubmit_on_detail_change = false
resubmit_on_source_change = false
change_debounce = "10s"

# 飞书应用身份；更换企业时更新凭证，并核对 tables_file 中的 Base / Table / Field ID。
[feishu]
app_id = ""
app_secret = ""
event_type = "drive.file.bitable_record_changed_v1"
log_raw_events = false

[anyreceipt]
api_key = ""

# SealAI 单据通道、访问凭证和回调鉴权；规则在 SealAI 系统维护。
[seal]
document_url = "https://mediastorm-test.sealai.cc/api/v1/integrations/webhook/wh_1790692906316_6z2eao6/document"
bearer_token = ""
callback_token = ""

[runtime]
http_addr = ":8080"
log_level = "info"
shutdown_timeout = "10s"
state_dir = "data"

# 自有 Anthropic 兼容模型连接（当 recognition.provider = "model" 或 review.provider = "model" 时使用）。
[model]
api_key = ""
base_url = "https://api.deepseek.com/anthropic"
name = "deepseek-flash"
