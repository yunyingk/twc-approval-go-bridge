# 主运行配置示例（脱敏）；实际文件为同目录下的 config.toml（0600 权限，Git 忽略）。
# 业务多维表格拓扑与字段映射存放在同级的 tables/ 目录下。
tables_file = "configs/tables/enterprise.example.json"

# ==========================================
# 1. 海外小票附件识别（OCR 提取与台账回写）
# ==========================================
[recognition] # 也支持写为 ["海外小票附件识别"]
provider = "disabled"     # 识别提供方：anyreceipt（外部识别） / model（自建大模型） / disabled（关闭）
trigger_mode = "both"     # 触发方式：event（飞书变更事件） / poll（定时轮询） / both（两者皆有）
poll_interval = "5m"      # 轮询时间间隔
poll_startup = "baseline" # 启动时策略：baseline（仅记录基线） / process（立即处理旧附件）

# ==========================================
# 2. 单据 AI 审批（机审与结果回写）
# ==========================================
[review] # 也支持写为 ["单据AI审批"]
provider = "seal"                   # 审核提供方：seal（外部 SealAI） / model（自建大模型）
trigger_mode = "manual"             # 触发方式：after_recognition（识别完成自动送审） / manual（手动提交）
include_transactions = true         # 是否联动读取已绑定的交易流水
resubmit_on_detail_change = false   # 报销明细修改后是否自动重审
resubmit_on_source_change = false   # 票据台账/流水修改后是否自动重审
change_debounce = "10s"             # 修改事件防抖等待时间
# rules_file = "configs/rules/review.example.json" # 自建模型 (provider="model") 时的审核规则文件（支持绝对路径或相对路径，默认双通道优先找工作目录，兜底拼主配置所在目录）

# ==========================================
# 3. 交易流水自动巡检与批量通知（过滤规则见 internal/feishu/card/filter.go）
# ==========================================
[transactions]
auto_notify = false         # 是否在常驻服务中自动定期巡检流水并向持卡人催发补票卡片（默认关闭）
poll_interval = "5m"        # 扫描轮询周期
debounce = "3s"             # 飞书长连接实时变更防抖时间（防范第三方分步写入，稳定后再触发识别）

# ==========================================
# 4. 飞书应用身份（用于连接多维表格与事件订阅）
# ==========================================
[feishu]
app_id = ""
app_secret = ""
# 飞书企业专属 Host / 域名（如 https://your-company.feishu.cn，用于生成多维表格表单或记录跳转链接）
host = ""
event_type = "drive.file.bitable_record_changed_v1"
log_raw_events = false

# ==========================================
# 4. Anyreceipt 海外小票识别凭证
# ==========================================
[anyreceipt]
api_key = ""

# ==========================================
# 5. SealAI 单据通道与回调凭据（规则在 Seal 系统维护）
# ==========================================
[seal]
# SealAI 服务地址（支持域名或完整 URL，如 https://mediastorm-test.sealai.cc）
base_url = "https://mediastorm-test.sealai.cc"

# Webhook 接入通道 ID（SealAI 控制台分配的 Webhook 标识）
webhook_id = "wh_1790692906316_6z2eao6"

# 送审身份令牌（Bridge -> SealAI）：
# 本桥接服务主动向 SealAI 提交发票/单据时，在 HTTP Header 携带 Authorization: Bearer <bearer_token>
# 用于向 SealAI 证明发单者身份并核验调用额度。
bearer_token = ""

# 回调防伪令牌（SealAI -> Bridge）：
# SealAI 机审完成后，向本服务公网回调地址（POST /seal/callback/<callback_token>）推送异步审批结果。
# 用于校验回调确实来自真实的 SealAI，防止公网恶意请求伪造审批结果篡改多维表格（需 >= 32 位随机字符）。
callback_token = ""

# ==========================================
# 6. 本地运行服务参数
# ==========================================
[runtime]
http_addr = ":8080"
log_level = "info"
shutdown_timeout = "10s"
# 持久化状态目录（存储发票防重 Checkpoint、待办任务与记录绑定关系）
# • Docker 容器推荐："/data"（对应 deploy/docker-compose.yml 挂载卷）
# • Linux 主机推荐："data"（当前运行目录下的 data/ 文件夹）
# • 留空或缺省时：代码自动默认回退到 "data"
state_dir = "data"
# 监控看板访问密码（可选，留空则无需密码；公网部署建议设置，通过 HTTP Basic Auth 保护）
dashboard_password = ""

# ==========================================
# 7. 自建 Anthropic 兼容模型连接（可选，备用）
# ==========================================
[model]
api_key = ""
base_url = "https://api.deepseek.com/anthropic"
name = "deepseek-flash"
