name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.24.13'
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test without Anthropic
        run: go test -tags no_anthropic ./...

      - name: Vet without Anthropic
        run: go vet -tags no_anthropic ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./cmd/server

      - name: Build without Anthropic
        run: CGO_ENABLED=0 go build -tags no_anthropic ./cmd/server
