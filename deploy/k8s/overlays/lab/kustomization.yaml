apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: twc-lab
resources:
  - ../../base
  - policy.yaml
patches:
  - target:
      kind: Ingress
      name: twc-approval-bridge-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: twc-approval-bridge-ingress
  - target:
      kind: PersistentVolumeClaim
      name: twc-approval-data-pvc
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: twc-approval-data-pvc
      spec:
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
  - target:
      kind: Service
      name: twc-approval-bridge-svc
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: twc-approval-bridge-svc
      spec:
        type: NodePort
        ports:
          - name: http
            port: 8080
            targetPort: 8080
            protocol: TCP
            nodePort: 30080
