# ==============================================================================
# TWC Approval Go Bridge - Kubernetes 标准部署清单 (Production Template)
# ==============================================================================
# 说明：
# 1. 镜像地址替换：将 <IMAGE_REGISTRY_URL> 替换为数科私有仓库实际路径与版本 tag。
# 2. 二级域名替换：将 <YOUR_SECONDARY_DOMAIN> 替换为数科分配的实际二级域名。
# 3. 配置文件注入：通过同名 ConfigMap/Secret 挂载到容器内的 /configs/ 目录。
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: twc-approval-bridge
  namespace: default
  labels:
    app: twc-approval-bridge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: twc-approval-bridge
  template:
    metadata:
      labels:
        app: twc-approval-bridge
    spec:
      containers:
        - name: server
          image: <IMAGE_REGISTRY_URL>/twc-approval-go-bridge:v0.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILE
              value: /configs/config.toml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # 存活探针：检测服务进程是否健康存活
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针：K8S 确认通过后才接入网关与域名流量
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /configs
              readOnly: true
            - name: data-volume
              mountPath: /data
      volumes:
        # 主配置文件（由 ConfigMap 或 Secret 挂载）
        - name: config-volume
          configMap:
            name: twc-approval-config
        # 本地状态缓存持久化（可根据需要升级为 PVC）
        - name: data-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: twc-approval-bridge-svc
  namespace: default
  labels:
    app: twc-approval-bridge
spec:
  type: ClusterIP
  selector:
    app: twc-approval-bridge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twc-approval-bridge-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # 若数科网关配置了证书与自动重定向，可按需开启：
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: <YOUR_SECONDARY_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twc-approval-bridge-svc
                port:
                  number: 8080
