# ==============================================================================
# TWC Approval Go Bridge - Kubernetes 基础清单（生产环境仍需接入验收）
# ==============================================================================
# 关键约束与说明：
# 1. 单活 Pod 架构约束（强制锁定 replicas: 1）：
#    - 桥接服务依赖主机级排他锁（syscall.Flock）保证小票识别去重与 Checkpoint 的确定性；
#    - 飞书长连接（WebSocket）要求单一活跃客户端消费，避免多客户端导致事件去重状态割裂；
#    - 【严禁】将 replicas 修改为大于 1，【严禁】对此服务启用 HPA 自动水平扩缩容。
# 2. 存储持久化（PVC）：
#    - /data 目录承载发票去重 Checkpoint、任务绑定及运行时审计文件；
#    - 生产环境建议通过下方声明的 PersistentVolumeClaim（twc-approval-data-pvc）挂载。
# 3. 域名与配置替换：
#    - 镜像地址：通过环境 overlay 替换 twc-approval-go-bridge:unconfigured。
#    - 二级域名：将 <YOUR_SECONDARY_DOMAIN> 替换为数科分配的公网二级域名（SealAI 回调依赖公网解析）。
# ==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twc-approval-data-pvc
  namespace: default
  labels:
    app: twc-approval-bridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # 可根据数科集群 StorageClass 实际名称指定（留空则使用默认存储类）：
  # storageClassName: "standard"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twc-approval-bridge
  namespace: default
  labels:
    app: twc-approval-bridge
spec:
  # 【强制锁定单副本】：单活 Pod，禁止水平扩容
  replicas: 1
  strategy:
    type: Recreate # 保证新 Pod 启动前旧 Pod 完全释放文件锁与飞书长连接
  selector:
    matchLabels:
      app: twc-approval-bridge
  template:
    metadata:
      labels:
        app: twc-approval-bridge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: twc-approval-go-bridge:unconfigured
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: CONFIG_FILE
              value: /configs/config.toml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # 存活探针：检测服务进程是否健康存活
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针：K8S 动态检测业务依赖（飞书长连接/配置等），通过后才接入网关与域名流量
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /configs
              readOnly: true
            - name: data-volume
              mountPath: /data
      volumes:
        # 主配置含凭据，必须使用 Secret；仅向本 Pod 的运行组开放读取。
        - name: config-volume
          secret:
            secretName: twc-approval-config
            defaultMode: 0440
            items:
              - key: config.toml
                path: config.toml
              - key: tables.json
                path: tables/enterprise.json
        # 生产持久化存储（绑定上方声明的 PVC）
        - name: data-volume
          persistentVolumeClaim:
            claimName: twc-approval-data-pvc
        # 若在临时测试环境中无需 PVC，可替换为 emptyDir：
        # - name: data-volume
        #   emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: twc-approval-bridge-svc
  namespace: default
  labels:
    app: twc-approval-bridge
spec:
  type: ClusterIP
  selector:
    app: twc-approval-bridge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twc-approval-bridge-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # 若数科网关配置了证书与自动重定向，可按需开启：
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: <YOUR_SECONDARY_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twc-approval-bridge-svc
                port:
                  number: 8080
