# Dedicated development ingress. The callback URL contains a secret, so neither
# access nor error logs may record request URLs for this virtual host.
server {
    listen 80;
    server_name twc-approval.example.com; # 请替换为实际公网服务域名
    access_log off;
    error_log /dev/null crit;
    return 404;
}

server {
    listen 443 ssl http2;
    server_name twc-approval.example.com; # 请替换为实际公网服务域名

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;

    client_max_body_size 1m;
    client_body_timeout 15s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz { proxy_pass http://frps:8080; }
    location = /readyz { proxy_pass http://frps:8080; }
    location = /version { proxy_pass http://frps:8080; }

    location ~ "^/seal/callback/[A-Za-z0-9_-]{32,}$" {
        limit_except POST { deny all; }
        proxy_pass http://frps:8080;
    }

    # Dashboard and live status API (protected by dashboard_password)
    location = / { proxy_pass http://frps:8080; }
    location = /api/status { proxy_pass http://frps:8080; }

    # Keep the local mock and any other private routes blocked.
    location / { return 404; }
}
